[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apthmm"
version = "0.1.0"
description = "Detección de etapas de APT con un HMM sobre ventanas de flujos de red (DAPT2020, Unraveled)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "hmmlearn>=0.3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
